<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>ESGRI</title>
    <style type="text/css">
        @import url(https://fonts.googleapis.com/css?family=Nunito);

        img {
            max-width: 218px;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
            object-fit: contain;
        }

        html {
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            border: 0;
            outline: none;
            color: #2d387b;
        }

        a img {
            border: none;
        }

        td,
        h1,
        h2,
        h3 {
            font-family: Helvetica, Arial, sans-serif;
            font-weight: 400;
        }

        body {
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: none;
            width: 100%;
            height: 100%;
            color: #666;
            background: #fff;
            font-size: 16px;
            height: 100vh;
            width: 100%;
            padding: 0px;
            margin: 0px;
        }

        .headig_line{
            color: #444; 
            font-size: 30px; 
            text-align: center; 
            font-weight: 700;
            padding: 0 20px;
        }

        table {
            border-collapse: collapse !important;
        }

        .force-full-width {
            width: 100% !important;
        }

        @media screen {

            td,
            h1,
            h2,
            h3 {
                font-family: 'Nunito', 'Helvetica Neue', 'Arial', 'sans-serif' !important;
            }
        }

        @media only screen and (max-width: 480px) {

            table[class="w320"] {
                width: 440px !important;
            }
.headig_line{
    font-size : 20px;
padding : 0 20px;
}
        }

        .name {
            background-color: #2d387b;
        }

        .name:hover {
            background-color: #49bfae;
        }
    </style>

</head>

</html>
